<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>Viaggi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Newsreader:opsz,wght@6..72,400&family=DM+Mono:wght@400&display=swap">
<style>
:root{--bg:#EEF0EA;--ink:#182019;--muted:#5B675F;--line:#CDD5CB;--accent:#B97A14;--surface:#F7F8F4}
@media (prefers-color-scheme:dark){:root{--bg:#0E1411;--ink:#EEE7D8;--muted:#A3AC9F;--line:#2A3630;--accent:#E0A43C;--surface:#161E19;color-scheme:dark}}
body{background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:18px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:56px 80px;display:grid;gap:28px}
h1{font-family:"Bricolage Grotesque",Impact,sans-serif;font-weight:800;font-size:clamp(64px,12vw,140px);letter-spacing:-.04em;line-height:.85;margin:0}
.eyebrow{font-family:"DM Mono",monospace;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
a.trip{display:grid;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
a.trip img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
a.trip div{padding:16px 18px 18px;display:grid;gap:4px}
a.trip b{font-family:"Bricolage Grotesque",Impact,sans-serif;font-weight:800;font-size:28px}
a.trip span{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--muted)}
a.trip:hover{border-color:var(--accent)}
</style>
</head><body><main class="wrap">
<p class="eyebrow">Famiglia Salber · album di viaggio</p>
<h1>Viaggi</h1>
<div class="grid">
<a class="trip" href="2026-10-tuscia/"><img src="2026-10-tuscia/foto/6375-t.webp" alt="La piazza di Vallerano"><div><span>23 – 25 ottobre 2026 · Italia</span><b>Tuscia</b><span>Vallerano, San Martino al Cimino</span></div></a>
</div>
</main></body></html>
